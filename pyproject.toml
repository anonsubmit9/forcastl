[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forcastl"
version = "0.1.0"
description = "FORCAST-L — a local benchmark for LLM Windows forensic-artefact triage"
readme = "PROJECT.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "data/evtx/LICENSE.md",
    "data/evtx/evtx-baseline-LICENSE",
]
authors = [{ name = "FORCAST-L maintainers" }]
dependencies = [
    "requests>=2.31.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0"]
dev = ["pytest>=8.0.0,<9", "pytest-cov>=5", "httpx>=0.27.0", "ruff>=0.6"]

[project.scripts]
forcastl-detect = "forcastl.cli.detect:main"
forcastl-compare = "forcastl.cli.compare:main"
forcastl-benchmark = "forcastl.cli.benchmark:main"
forcastl-score = "forcastl.cli.score:main"
forcastl-web = "forcastl.webapp.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forcastl = [
    "webapp/static/*",
    "webapp/static/**/*",
    "reporting/templates/*",
    "validation/schemas/*",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    # Full-corpus tests (~25-50s each — they run the 300-file GT validation).
    # Deselect for a fast local red-green loop: pytest -m "not slow".
    "slow: end-to-end tests over the full corpus; run in CI, skip locally",
]

[tool.ruff]
# Archived one-off corpus/audit scripts are kept for provenance, not maintained.
extend-exclude = ["tools/archive"]

[tool.ruff.lint]
# Conservative, high-signal: pyflakes (real bugs — unused/undefined names,
# redefinitions) only. Style rules are intentionally NOT enabled to avoid a
# noisy retrofit; expand later if desired.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are "unused" by design.
"__init__.py" = ["F401"]
# smoke_test.py deliberately imports symbols to verify they import.
"tools/smoke_test.py" = ["F401"]
